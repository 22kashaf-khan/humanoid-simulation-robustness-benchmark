experiment:
  name: ab_power_regularized_v1

seeds:
  - 42
  - 123
  - 456
  - 789
  - 2026

robot:
  name: Unitree H1
  task: Isaac-Velocity-Flat-H1-v0

policy:
  checkpoint: baseline_checkpoints/power_regularized_v1.pt

evaluation:
  num_envs: 64
  episodes: 100
  headless: true

scenarios:

  - name: nominal
    physics_modifications: none

  - name: friction_0_3_0_2
    physics_modifications:
      friction:
        static: 0.3
        dynamic: 0.2

  - name: mass_1_4x
    physics_modifications:
      mass_scale: 1.4

  - name: actuator_effort_0_4x
    physics_modifications:
      actuator_effort_scale: 0.4
