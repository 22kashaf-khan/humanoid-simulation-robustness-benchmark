experiment:
  name: fall_validation_low_friction
  seed: 42

robot:
  name: Unitree H1
  task: Isaac-Velocity-Flat-H1-v0

policy:
  checkpoint: baseline_checkpoints/baseline_v1.pt

evaluation:
  num_envs: 64
  episodes: 100
  headless: true

scenario:
  name: low_friction_validation
  physics_modifications:
    friction:
      static: 0.05
      dynamic: 0.05

metrics:
  success_rate: true
  fall_rate: true
  velocity_tracking_rmse: true
  episode_length: true
  base_orientation_error: true
  joint_limit_violations: true

output:
  directory: reports/fall_validation_low_friction
